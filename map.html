<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>26도쿄 · Hana 여행지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --ink: #2b2620;
    --sub: #7a6f60;
    --line: #e6e0d4;
    --accent: #b5433c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 24px 24px 12px;
    text-align: center;
  }
  header h1 { font-size: 24px; letter-spacing: -0.5px; }
  header h1 .tk { color: var(--accent); }
  header p { color: var(--sub); font-size: 13px; margin-top: 5px; }
  header p a { color: #1a6fb5; }
  .layout {
    display: flex;
    gap: 16px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 16px 24px;
    height: calc(100vh - 100px);
    height: calc(100dvh - 100px);
    min-height: 480px;
  }
  #map {
    flex: 1.2;
    border-radius: 14px;
    border: 1px solid var(--line);
    min-width: 0;
  }
  .side {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; font-weight: 600;
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--card); color: var(--sub);
    cursor: pointer; transition: all .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .list {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    padding-right: 4px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateX(-2px); }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(181,67,60,.15); }
  .card .top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .card .cat {
    font-size: 11px; font-weight: 700;
    color: var(--accent);
    background: rgba(181,67,60,.09);
    padding: 2px 8px; border-radius: 20px; white-space: nowrap;
  }
  .card .name { font-weight: 700; font-size: 15px; }
  .card .memo { font-size: 13px; color: var(--sub); line-height: 1.5; }
  .card .links { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .card .links a {
    font-size: 12px; color: #1a6fb5; text-decoration: none;
    border: 1px solid #cfe2f0; background: #f2f8fc;
    border-radius: 6px; padding: 3px 8px;
  }
  .card .links a:hover { background: #e2eff8; }
  .marker-pin {
    width: 30px; height: 30px;
    border-radius: 50% 50% 50% 0;
    background: var(--accent);
    transform: rotate(-45deg);
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
  }
  .marker-pin span {
    transform: rotate(45deg);
    color: #fff; font-size: 12px; font-weight: 700;
  }
  .marker-pin.sel {
    background: #1a6fb5;
    transform: rotate(-45deg) scale(1.25);
    z-index: 1000;
  }
  .marker-wrap { animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop {
    0% { transform: scale(0) translateY(-20px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .marker-wrap { animation: none; }
  }
  .leaflet-popup-content { font-family: inherit; font-size: 13px; line-height: 1.5; }
  .leaflet-popup-content b { font-size: 14px; }
  .leaflet-popup-content a { color: #1a6fb5; }
  @media (max-width: 820px) {
    header { padding: 16px 16px 8px; }
    header h1 { font-size: 20px; }
    header p { font-size: 12px; }
    .layout { flex-direction: column; height: auto; min-height: 0; padding: 0 10px 20px; gap: 10px; }
    #map { height: 48vh; height: 48dvh; flex: none; }
    .side { flex: none; }
    .filters {
      position: sticky; top: 0; z-index: 500;
      background: var(--bg); padding: 6px 0;
      overflow-x: auto; flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .chip { flex: 0 0 auto; padding: 7px 14px; }
    .list { overflow: visible; }
    .card { padding: 14px; }
    .card .links a { padding: 6px 12px; font-size: 13px; }
  }
</style>

      { bn: "다루마 츠키시마 본점", q: "月島もんじゃ だるま 月島本店", lat: 35.6628, lng: 139.7848 },
    ] },
  { num: 21, cat: "명소", name: "시바공원 芝公園 & 조조지", memo: "도쿄타워 아래 공원. 조조지 절 지붕 뒤로 도쿄타워가 겹치는 포토스팟. 단, 도쿄타워 자체는 옆의 '프린스 공원'(29번)이 더 잘 보임 — 사진 목적이면 그쪽 추천. 아자부다이 힐스에서 도보 10분, 1일차 저녁 산책 코스.", q: "芝公園", lat: 35.6567, lng: 139.7484,
    extra: [
      { label: "조조지 増上寺", q: "増上寺" },
      { label: "도쿄타워", q: "東京タワー" },
    ] },
  { num: 22, cat: "명소", name: "즈이쇼지 瑞聖寺", memo: "구마 겐고가 리뉴얼한 절 — 물에 비치는 대웅전이 포인트. 16:45 마감이라 시로카네다이에서 첫 순서로. 1일차.", q: "瑞聖寺", lat: 35.6383, lng: 139.7264 },
  { num: 23, cat: "명소", name: "도쿄도 테이엔미술관", memo: "옛 아사카노미야 저택(아르데코 건축) + 정원. 18:00 마감. 즈이쇼지에서 도보 10분 안쪽. 1일차.", q: "東京都庭園美術館", lat: 35.6366, lng: 139.7195 },
  { num: 24, cat: "명소", name: "아자부다이 힐스", memo: "2023년 오픈한 도쿄 새 랜드마크. 도쿄타워 뷰 + 저녁 산책, 팀랩 보더리스도 여기. 소바마에 야마토가 타워플라자 3층. 1일차 저녁.", q: "麻布台ヒルズ", lat: 35.6605, lng: 139.7413 },
  { num: 25, cat: "명소", name: "구 이와사키 저택 정원 (旧岩崎邸庭園)", memo: "미쓰비시가 저택 — 콘더 설계 서양관이 유명. 9시 오픈이라 아침 첫 코스로 좋음. 2일차.", q: "旧岩崎邸庭園", lat: 35.7081, lng: 139.7674 },
  { num: 26, cat: "명소", name: "도쿄국립박물관", memo: "우에노 공원 안, 일본 국보·문화재 최대 컬렉션. 본관 하이라이트 위주 1~2시간 추천. 2일차.", q: "東京国立博物館", lat: 35.7188, lng: 139.7765 },
  { num: 27, cat: "명소", name: "네즈미술관 + 카페", memo: "10:00 입장 예매 완료 ✅ (6/2). 구마 겐고 건축 + 대나무 진입로 + 일본 정원 + NEZUCAFÉ. 오모테산도역 도보 8분. 3일차.", q: "根津美術館", lat: 35.6622, lng: 139.7175 },
  { num: 28, cat: "명소", name: "신마루노우치 빌딩 테라스", memo: "7층 무료 테라스 — 도쿄역 붉은 벽돌 역사가 정면으로 내려다보이는 야경 명당. 2일차 저녁.", q: "新丸の内ビルディング", lat: 35.6829, lng: 139.7645 },
  { num: 29, cat: "명소", name: "프린스 공원 (파크타워 앞 잔디 언덕)", memo: "더 프린스 파크타워 도쿄 호텔 앞 넓은 잔디밭·언덕 — 시바공원보다 도쿄타워가 훨씬 잘 보이는 뷰 맛집. 잔디에 앉아 타워를 정면으로 보는 사진 스팟. 시바공원·조조지와 붙어 있어 같이 돌면 됨. ※마커는 잔디밭 대략.", q: "ザ・プリンス パークタワー東京", lat: 35.6553, lng: 139.7460,
    extra: [
      { label: "시바공원 4호지", q: "芝公園 4号地" },
    ] },
];

const gmap = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;

const map = L.map('map').setView([35.675, 139.73], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

const listEl = document.getElementById('list');
const markers = {};

// 지점 목록으로 정규화 (단일 지점도 배열로)
const pointsOf = p => p.branches || [{ bn: null, q: p.q, lat: p.lat, lng: p.lng }];

PLACES.forEach((p, i) => {
  markers[p.num] = pointsOf(p).map(b => {
    const icon = L.divIcon({
      className: '',
      html: `<div class="marker-wrap" style="animation-delay:${i * 70}ms"><div class="marker-pin" data-num="${p.num}"><span>${p.num}</span></div></div>`,
      iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -30]
    });
    const m = L.marker([b.lat, b.lng], { icon }).addTo(map);
    const title = b.bn ? `${p.name} — ${b.bn}` : p.name;
    m.bindPopup(`<b>${title}</b><br>${p.memo}<br><a href="${gmap(b.q)}" target="_blank">📍 구글맵에서 열기</a>`);
    m.on('click', () => highlight(p.num));
    return m;
  });

  const links = pointsOf(p).map(b =>
    `<a href="${gmap(b.q)}" target="_blank" onclick="event.stopPropagation()">📍 ${b.bn || '구글맵'}</a>`
  ).join('') + (p.extra || []).map(e =>
    `<a href="${gmap(e.q)}" target="_blank" onclick="event.stopPropagation()">📍 ${e.label}</a>`
  ).join('');

  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + p.num;
  card.innerHTML = `
    <div class="top"><span class="cat">${p.cat}</span><span class="name">${p.name}</span></div>
    <div class="memo">${p.memo}</div>
    <div class="links">${links}</div>`;
  card.addEventListener('click', () => {
    const pts = pointsOf(p);
    if (pts.length > 1) {
      map.flyToBounds(L.latLngBounds(pts.map(b => [b.lat, b.lng])), { padding: [60, 60], duration: 0.8 });
    } else {
      map.flyTo([pts[0].lat, pts[0].lng], 16, { duration: 0.8 });
      markers[p.num][0].openPopup();
    }
    highlight(p.num);
  });
  listEl.appendChild(card);
});

// 처음 열 때 모든 마커(이마한 전 지점 포함)가 한 화면에 들어오게
map.fitBounds(
  L.latLngBounds(PLACES.flatMap(p => pointsOf(p).map(b => [b.lat, b.lng]))),
  { padding: [40, 40] }
);

// 카테고리 필터
const cats = ['ALL', ...new Set(PLACES.map(p => p.cat))];
const filtersEl = document.getElementById('filters');
cats.forEach(cat => {
  const chip = document.createElement('button');
  chip.className = 'chip' + (cat === 'ALL' ? ' on' : '');
  chip.textContent = cat === 'ALL' ? '전체' : cat;
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    chip.classList.add('on');
    PLACES.forEach(p => {
      const show = cat === 'ALL' || p.cat === cat;
      document.getElementById('card-' + p.num).style.display = show ? '' : 'none';
      markers[p.num].forEach(m => { if (show) { m.addTo(map); } else { map.removeLayer(m); } });
    });
    const pts = PLACES.filter(p => cat === 'ALL' || p.cat === cat)
      .flatMap(p => pointsOf(p).map(b => [b.lat, b.lng]));
    if (pts.length) {
      map.flyToBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 15, duration: 0.6 });
    }
  });
  filtersEl.appendChild(chip);
});

function highlight(num) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  const c = document.getElementById('card-' + num);
  c.classList.add('active');
  c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  document.querySelectorAll('.marker-pin').forEach(el =>
    el.classList.toggle('sel', el.dataset.num === String(num)));
}
</script>
</body>
</html>
